<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./img/TradeBill-logo02.png">
  <link rel="icon" href="./img/TradeBill-logo02.png" type="image/png">
  <meta name="theme-color" content="#10b981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TradeBill">
  <title>TradeBill — Field Service Estimate & Invoice Generator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf.js CDN for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- External Custom Stylesheet -->
  <link rel="stylesheet" href="./CSS/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

  <!-- Top Navigation Bar -->
  <header class="bg-slate-900 text-white py-4 px-6 shadow-md flex justify-between items-center no-print">
    <div class="flex items-center space-x-2">
      <div class="bg-emerald-500 text-slate-900 font-black px-2 py-1 rounded text-xs tracking-wider">TB</div>
      <span class="font-bold text-sm tracking-wide">TradeBill</span>
    </div>

    <div class="flex items-center space-x-2">
      <button id="btnHistory" class="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-100 rounded border border-slate-700 transition">
        History
      </button>
      <button id="btnSaveProfile" class="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-100 rounded border border-slate-700 transition">
        Save Profile
      </button>
      <button id="btnExportPdf" class="px-3 py-1.5 text-xs font-semibold bg-emerald-500 hover:bg-emerald-600 text-slate-900 rounded shadow transition">
        Export PDF
      </button>
    </div>
  </header>

  <!-- Main App Grid -->
  <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Left Column: Controls & Input Form -->
    <section class="lg:col-span-5 bg-white p-5 rounded-lg shadow-sm border border-slate-200 space-y-6 no-print">
      <h2 class="text-lg font-bold text-slate-900 border-b pb-2">Business & Client Info</h2>
      
      <!-- Company & Client Form Inputs -->
      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Company Logo</label>
          <input type="file" id="logoInput" accept="image/*" class="block w-full text-xs text-slate-500 file:mr-4 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Your Company Name</label>
            <input type="text" id="companyName" value="Apex HVAC & Field Services" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Client Name</label>
            <input type="text" id="clientName" value="John Doe" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Invoice #</label>
            <input type="text" id="invoiceNumber" value="INV-2026-001" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Tax (%)</label>
            <input type="number" id="taxRate" value="8.00" step="0.01" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Disc (%)</label>
            <input type="number" id="discountRate" value="0.00" step="0.01" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
        </div>
      </div>

      <!-- Line Items Section -->
      <div class="pt-4 border-t border-slate-200">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-base font-bold text-slate-900">Line Items</h3>
          <button id="btnAddRow" type="button" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold py-1 px-2.5 rounded border border-emerald-200 transition">+ Add Item</button>
        </div>

        <!-- Trade Presets Bar -->
        <div class="mb-3 flex flex-wrap gap-1.5">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400 self-center mr-1">Presets:</span>
          <button type="button" onclick="addPreset('HVAC System Diagnostic Inspection', 1, 85)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-emerald-100 text-slate-700 hover:text-emerald-800 rounded font-medium border border-slate-200 transition">Inspection ($85)</button>
          <button type="button" onclick="addPreset('Refrigerant Recharge (R-410A)', 2, 65)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-emerald-100 text-slate-700 hover:text-emerald-800 rounded font-medium border border-slate-200 transition">R-410A ($65/unit)</button>
          <button type="button" onclick="addPreset('Condensate Drain Line Flush', 1, 95)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-emerald-100 text-slate-700 hover:text-emerald-800 rounded font-medium border border-slate-200 transition">Drain Flush ($95)</button>
        </div>

        <div id="itemsContainer" class="space-y-3">
          <!-- Item rows get dynamically inserted here -->
        </div>
      </div>

      <!-- Notes / Payment Terms -->
      <div class="pt-4 border-t border-slate-200">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Payment Terms / Notes</label>
        <textarea id="invoiceNotes" rows="2" class="w-full border rounded px-3 py-2 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">Payment due within 15 days. Thank you for your business!</textarea>
      </div>
    </section>

    <!-- Right Column: Live PDF Preview Document -->
    <section class="lg:col-span-7 flex justify-center">
      <div id="invoicePreview" class="bg-white w-full max-w-2xl p-8 rounded-lg shadow border border-slate-200 min-h-[700px] flex flex-col justify-between text-slate-800">
        <!-- Rendered invoice document loads here via JavaScript -->
      </div>
    </section>

  </main>

  <!-- History Drawer Modal -->
  <div id="historyModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-end">
    <div class="bg-white w-full max-w-sm h-full p-5 shadow-2xl flex flex-col justify-between overflow-y-auto">
      <div>
        <div class="flex justify-between items-center border-b border-slate-200 pb-3 mb-4">
          <h3 class="text-base font-bold text-slate-900">Invoice History</h3>
          <button id="btnCloseHistory" class="text-slate-400 hover:text-slate-600 text-2xl leading-none font-bold">&times;</button>
        </div>
        <div id="historyList" class="space-y-2.5 text-xs">
          <!-- Saved history items render here -->
        </div>
      </div>
    </div>
  </div>

  <script src="./Javascript/app.js"></script>
</body>
</html>
